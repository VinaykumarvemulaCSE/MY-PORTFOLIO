<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Vinay Kumar Vemula</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #030712;
        color: #e5e7eb;
      }
      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        padding: 40px 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.03);
      }
      .dot {
        width: 44px;
        height: 44px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f59e0b, #ef4444);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: #9ca3af;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: #f59e0b;
        color: #111827;
        font-weight: 700;
        font-size: 0.9rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="dot" aria-hidden="true"></div>
      <h1>You&rsquo;re offline</h1>
      <p>
        This page wasn&rsquo;t cached yet. Reconnect and reload to see the latest
        projects and certificates.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
